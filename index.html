<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Celebration</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,600;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #faf6f3;
            --accent-pink: #e8b4b8;
            --rose-gold: #b96e7c;
            --text-main: #4a3e3d;
            --card-white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'DM Sans', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scene {
            display: none;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            position: absolute;
        }

        .scene.active {
            display: block;
            opacity: 1;
            position: relative;
        }

        h1, h2 {
            font-family: 'Playfair Display', serif;
            color: var(--rose-gold);
            margin-bottom: 15px;
        }

        p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            background: linear-gradient(135deg, #e8b4b8, #b96e7c);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(185, 110, 124, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(185, 110, 124, 0.4);
        }

        /* Scene 1: Envelope */
        .envelope-wrapper {
            width: 200px;
            height: 140px;
            background: #e0a9af;
            margin: 40px auto;
            position: relative;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .envelope-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
            border-top: 70px solid #c98893;
            transform-origin: top;
            transition: transform 0.5s;
        }

        .envelope-wrapper:hover::before {
            transform: rotateX(180deg);
        }

        .heart-seal {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
        }

        /* Scene 2: Cake & Candle */
        .cake {
            width: 150px;
            height: 100px;
            background: #f4d0d4;
            margin: 50px auto 20px;
            border-radius: 10px 10px 0 0;
            position: relative;
            box-shadow: inset 0 -10px 0 #e8b4b8;
        }

        .candle {
            width: 12px;
            height: 35px;
            background: #fff;
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 3px;
        }

        .flame {
            width: 12px;
            height: 18px;
            background: #ff9d00;
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: -18px;
            left: 0;
            box-shadow: 0 0 10px #ff9d00;
            animation: flicker 0.6s infinite alternate;
            cursor: pointer;
        }

        .flame.off {
            display: none;
        }

        @keyframes flicker {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        /* Gallery/Polaroid Frame */
        .polaroid {
            background: white;
            padding: 15px 15px 25px 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            border-radius: 4px;
            margin: 20px auto;
            transform: rotate(-2deg);
        }

        .polaroid img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 2px;
        }

        .caption {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>
<body>

    <!-- Scene 1: Welcome / Letter -->
    <div class="scene active" id="scene1">
        <h2>A Special Envelope For You</h2>
        <p>A little piece of warm wishes wrapped with care.</p>
        <div class="envelope-wrapper" onclick="nextScene(2)">
            <div class="heart-seal">✉️</div>
        </div>
        <button class="btn" onclick="nextScene(2)">Open Letter</button>
    </div>

    <!-- Scene 2: Cake & Candle Blow -->
    <div class="scene" id="scene2">
        <h2>Make a Wish!</h2>
        <p id="candle-text">Tap on the flame to blow out the candle.</p>
        <div class="cake">
            <div class="candle">
                <div class="flame" id="flame" onclick="blowCandle()"></div>
            </div>
        </div>
        <button class="btn" id="next2-btn" style="display: none;" onclick="nextScene(3)">Continue</button>
    </div>

    <!-- Scene 3: Memory & Wishes -->
    <div class="scene" id="scene3">
        <h2>Beautiful Moments</h2>
        <div class="polaroid">
            <!-- Apni image URL / path yahan replace karein -->
            <img src="https://via.placeholder.com/400x300/e8b4b8/ffffff?text=Your+Photo+Here" alt="Memory Photo">
            <div class="caption">Creating timeless memories together ✨</div>
        </div>
        <p>Wishing you endless smiles, joy, and warmth on your special day!</p>
        <button class="btn" onclick="nextScene(1)">Replay</button>
    </div>

    <script>
        function nextScene(sceneNumber) {
            const scenes = document.querySelectorAll('.scene');
            scenes.forEach(scene => scene.classList.remove('active'));
            
            setTimeout(() => {
                document.getElementById(`scene${sceneNumber}`).classList.add('active');
            }, 100);
        }

        function blowCandle() {
            const flame = document.getElementById('flame');
            const text = document.getElementById('candle-text');
            const nextBtn = document.getElementById('next2-btn');
            
            flame.classList.add('off');
            text.innerText = "Wish granted! 🎉";
            nextBtn.style.display = 'inline-block';
        }
    </script>
</body>
</html>
